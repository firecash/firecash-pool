# ZKas mining pool — public stratum bridge.
# One shared ZKas node. Port 5555 is the public auto/vardiff endpoint and
# port 5577 is the fixed-difficulty MRR compatibility endpoint. Legacy ports
# 5566, 5588, and 5599 are redirected to 5555 by
# zkas-pool-port-aliases.service; they are intentionally not separate pool
# instances. Miner application selection still chooses a coherent GodMiner
# legacy or Kaspa Common profile.
kaspad_address: "127.0.0.1:16110"
# ZKAS is 1 BPS. This is the ZKAS-template safety fallback; real Kaspa
# parent templates are observed immediately, then notifications are coalesced
# per miner profile (legacy ASIC default 1000ms, Common default 500ms).
block_wait_time: 1000
print_stats: true
log_to_file: false
health_check_port: ""
web_dashboard_port: ":3033"
var_diff: false
shares_per_min: 20
var_diff_stats: false
pow2_clamp: true
extranonce_size: 2
coinbase_tag_suffix: "zkas"

instances:
  # Auto — variable difficulty, adapts to the miner (recommended default).
  # IMPORTANT: the starting floor is also the *initial* difficulty a miner is
  # handed on connect. It must be safe for the strongest hardware: a multi-TH/s
  # ASIC handed a tiny difficulty submits tens of thousands of shares/sec, trips
  # the anti-abuse frame-rate limiter, and is disconnected before vardiff can
  # react — a death loop where the ASIC "barely gets blocks". So we seed a
  # sane ASIC-safe floor (~a few shares/sec even at 100+ TH/s) and let vardiff
  # adapt *up* for bigger hardware and *down* for GPUs.
  - stratum_port: ":5555"
    min_share_diff: 8192
    prom_port: ":2114"
    var_diff: true
    shares_per_min: 20
    log_to_file: false

  # MRR / proxy — fixed-difficulty compatibility endpoint. GodMiner uses its
  # observed working embedded-extranonce legacy profile; Common-capable miners
  # use the published Common profile.
  - stratum_port: ":5577"
    # 8192 is a conservative rental seed, not the only valid GodMiner value:
    # live working rigs have accepted 16384 and 32768. Keep this endpoint fixed
    # so an intervening rental proxy sees a stable target.
    min_share_diff: 8192
    prom_port: ":2116"
    var_diff: false
    shares_per_min: 20
    kaspa_common_protocol: true
    log_to_file: false

  # NiceHash / rented hashpower — narrow nonce prefix.
  #
  # A rental proxy multiplexes many rigs behind ONE pool connection, so it has to
  # subdivide whatever nonce space the pool leaves it. Kaspa's nonce is 8 bytes and
  # the pool's prefix comes off the front, so the 2-byte prefix used by the other
  # ports leaves only 6 bytes (2^48). A single 100 TH/s rented rig walks 2^48 in
  # about three seconds, and a proxy has to split that across many rigs at once --
  # which is why NiceHash wants the pool's prefix kept to one byte, leaving it 7.
  #
  # Deliberately a separate listener rather than a change to :5555 / :5577: those
  # work today for direct miners and MRR, and their prefix width is unchanged.
  # Fixed difficulty for the same reason :5577 is fixed -- an intervening proxy
  # should see a stable target rather than a moving one.
  - stratum_port: ":5511"
    min_share_diff: 8192
    prom_port: ":2118"
    var_diff: false
    shares_per_min: 20
    extranonce_size: 1
    log_to_file: false
